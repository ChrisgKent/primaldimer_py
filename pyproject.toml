[build-system]
requires = ["maturin>=1.3.0"]
build-backend = "maturin"

[project]
name = "primaldimer_py"
version = "1.1.1"
description = "PrimerDimer checker for PrimalScheme3"
readme = "README.md"
authors = [
    { name = "ChrisKent", email = "chrisgkent@protonmail.com" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]


